<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>SachIEpVien → Mega</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        width: 260px;
        margin: 0;
        padding: 14px;
        font: 13px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 14px;
      }
      label {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
      }
      p.hint {
        margin: 10px 0 0;
        opacity: 0.7;
        font-size: 12px;
      }
      #status {
        margin-top: 8px;
        font-size: 12px;
        min-height: 1em;
        opacity: 0.8;
      }
    </style>

  <body>
    <h1>SachIEpVien → Mega</h1>
    <label>
      <input type="checkbox" id="enabled" />
      Tự động resolve khi mở trang truyện
    </label>
    <p class="hint">
      Khi bật: mở trang detail của truyện sẽ tự tìm shortlink và chuyển sang mega.nz.
    </p>
    <div id="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
